name: update-e2e

# 自动更新端到端验证：正例（真实 GitHub 匿名端点全链路）+ 4 个负例（本地 http 夹具），
# 全部在 Windows 真机上、全部走匿名网络。
#
# 红线（本文件必须自证，不靠口头声明）：
# 1. 不触碰任何已发布 Release 资产：
#    · 只对 Release 做 **GET 下载**（匿名取真实安装包/签名/清单做基线）；
#    · 不 PUT/PATCH/DELETE，不 `gh release upload`，不创建/修改 Release。
#    本工作流**不含**任何 release 写操作，且不申请 `contents: write`——
#    权限上就没法改发布物（最小权限即结构性保证）。
# 2. 负例必须真的被拒：断言读的是插件真实返回的错误串，不接受「没崩就算过」。
# 3. 正例必须真的装上：断言读的是安装后 exe 的 FileVersion + 卸载注册表
#    DisplayVersion（NSIS 安装器写入），不是界面显示。
#
# 触发：workflow_dispatch（手动）。不挂 tag，避免与发布流水线互相干扰。
#
# ── 2026-10-29 改名后的两处结构性修订（v2.2.1）───────────────
# A. 产品名不再硬编码：v2.2.1 起 productName 由「个人工作台」改为「综合工作台」，
#    而**基线安装包**仍是旧名。故把「基线产品名」与「被测新包产品名」拆成两个变量：
#      $oldProduct = 基线包实际产品名（从基线安装包自身资源/发行者推出，见各步）
#      $newProduct = 当前源码 tauri.conf.json 的 productName（综合工作台）
#    这样 v2.1.0/v2.2.0（旧名）与 v2.2.1（新名）两条升级路径都能用同一份脚本，
#    且改名后再改一次名也不用动这里。
# B. 版本号不再硬编码：基线 tag、资产名、以及三处版本断言，全部由
#    「实际下载到的 latest.json 里的 version」派生（$baseVer），不再写死 2.1.0。
#
# ── v2.2.1 新增：升级真机实测（两条路径）──────────────────────
#   base_tag = v2.1.0 → 新包  与  base_tag = v2.2.0 → 新包，两条都要过。
#   验收口径（改名连带风险的真机证据）：
#     · 单份安装：旧卸载项（HKCU/HKLM）不存在、旧目录不存在、只有一套卸载项
#     · 桌面快捷方式为新名，且指向新目录
#     · 界面标题 = 「综合工作台 · 安徽省」（读真实窗口标题，不读配置）

on:
  workflow_dispatch:
    inputs:
      base_tag:
        description: "升级基线 Release tag（如 v2.1.0 / v2.2.0；留空则取 latest.json 指向的 tag）"
        required: false
        default: ""
      old_version:
        description: "构造的低版本构建版本号（须低于基线版本）"
        required: false
        default: "2.0.0"

# 只读：下载 Release 资产 / checkout。没有任何写权限，结构上不可能改发布物。
permissions:
  contents: read

jobs:
  e2e:
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: 打印运行上下文（匿名、无令牌）
        shell: pwsh
        run: |
          Write-Host "repo=$env:GITHUB_REPOSITORY  sha=$env:GITHUB_SHA  ref=$env:GITHUB_REF"
          Write-Host "run=$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          Write-Host "GITHUB_TOKEN 存在=$([bool]$env:GITHUB_TOKEN)（仅 read 权限，见 workflow permissions）"

      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: 安装 tauri-cli 与 Python 依赖确认
        shell: pwsh
        run: |
          cargo install tauri-cli --version "^2" --locked
          python --version

      # ── 解析基线版本：tag 与资产名全部从发布侧派生，不写死 ──
      - name: 解析基线版本与产品名（不写死版本号）
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.base_tag }}"
          if ([string]::IsNullOrWhiteSpace($tag)) { $tag = "latest" }
          Write-Host "基线 tag 目标：$tag"
          New-Item -ItemType Directory -Force -Path assets | Out-Null
          # 先取 latest.json（匿名），拿到真实版本号与真实资产 URL
          curl.exe -sS -L --max-time 120 -o "assets/latest.json" `
            -w "HTTP %{http_code} %{size_download}B  latest.json`n" `
            "https://github.com/$env:GITHUB_REPOSITORY/releases/$tag/download/latest.json"
          if ($LASTEXITCODE -ne 0) { throw "下载 latest.json 失败（tag=$tag）" }
          $j = Get-Content "assets/latest.json" -Raw | ConvertFrom-Json
          $baseVer = $j.version
          if ([string]::IsNullOrWhiteSpace($baseVer)) { throw "latest.json 缺 version 字段" }
          $winUrl = $j.platforms.'windows-x86_64'.url
          if ([string]::IsNullOrWhiteSpace($winUrl)) { throw "latest.json 缺 windows-x86_64.url" }
          # 版本断言与资产名的唯一来源：这里是本次运行实际拿到的版本
          "WB_BASE_VERSION=$baseVer" | Out-File -Encoding utf8 -Append $env:GITHUB_ENV
          "WB_BASE_URL=$winUrl"       | Out-File -Encoding utf8 -Append $env:GITHUB_ENV
          # 新包产品名：直接从当前源码配置读，改名后再改名这里自动跟随
          $newProduct = (Get-Content "apps/desktop/src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json).productName
          "WB_NEW_PRODUCT=$newProduct" | Out-File -Encoding utf8 -Append $env:GITHUB_ENV
          Write-Host "基线版本=$baseVer 新包产品名=$newProduct"
          Write-Host "基线安装包 URL=$winUrl"

      # ── 匿名下载真实发布物（不带 Authorization 头；这是「普通用户可完成」的证据）──
      - name: 匿名下载基线发布资产（不携带任何令牌）
        shell: pwsh
        run: |
          # 资产名从 latest.json 的 URL 尾部取，不写死 workbench_2.1.0_x64-setup.exe
          $baseName = ($env:WB_BASE_URL -split '/')[-1]
          if ([string]::IsNullOrWhiteSpace($baseName)) { throw "无法从 URL 解析资产名：$env:WB_BASE_URL" }
          Write-Host "基线安装包资产名=$baseName"
          "WB_BASE_ASSET=$baseName" | Out-File -Encoding utf8 -Append $env:GITHUB_ENV
          curl.exe -sS -L --max-time 300 -o "assets/$baseName" -w "HTTP %{http_code} %{size_download}B  $baseName`n" $env:WB_BASE_URL
          if ($LASTEXITCODE -ne 0) { throw "匿名下载基线安装包失败：$env:WB_BASE_URL" }
          curl.exe -sS -L --max-time 120 -o "assets/$baseName.sig" -w "HTTP %{http_code} %{size_download}B  $baseName.sig`n" "$env:WB_BASE_URL.sig"
          if ($LASTEXITCODE -ne 0) { throw "匿名下载基线签名失败" }
          Get-ChildItem assets | ForEach-Object {
            Write-Host ("  {0} = {1} 字节  sha256={2}" -f $_.Name, $_.Length,
              (Get-FileHash $_.FullName -Algorithm SHA256).Hash.Substring(0,16))
          }
          if (-not (Test-Path "assets/$baseName")) { throw "基线安装包未下载成功" }
          # 基线包的真实产品名：从安装包版本资源的 ProductName 读，而不是猜
          $vi = (Get-Item "assets/$baseName").VersionInfo
          $oldProduct = $vi.ProductName
          if ([string]::IsNullOrWhiteSpace($oldProduct)) { throw "无法从基线安装包读取 ProductName" }
          Write-Host "基线安装包 ProductName=$oldProduct  FileVersion=$($vi.FileVersion) ProductVersion=$($vi.ProductVersion)"
          "WB_OLD_PRODUCT=$oldProduct" | Out-File -Encoding utf8 -Append $env:GITHUB_ENV
          # 基线版本必须与清单一致，否则夹具口径不成立
          if ($vi.FileVersion -notlike "$env:WB_BASE_VERSION*") {
            throw "基线安装包 FileVersion=$($vi.FileVersion) 与 latest.json version=$env:WB_BASE_VERSION 不一致"
          }
          # 本 job 验的是「当前产品名的更新通道」，更新装上的就是基线包 ——
          # 基线包产品名与源码产品名不同（例如基线仍是旧名的 v2.1.0/v2.2.0）时，
          # 装完会落在另一个安装目录，后续断言会错误归因。这里直接前置拦下，
          # 并指明改名迁移由 rename-upgrade job 负责，避免用错 job 得出错误结论。
          if ($oldProduct -ne $env:WB_NEW_PRODUCT) {
            throw ("基线包产品名「$oldProduct」与源码产品名「$env:WB_NEW_PRODUCT」不一致：本 job 只验同名更新通道。" +
                   "改名迁移（旧名→新名）请用 rename-upgrade job（矩阵 baseline v2.1.0/v2.2.0）；" +
                   "若刚改名，请先发布 v2.2.1 使 latest 指向新名包后再跑本 job。")
          }

      - name: 匿名可达性断言（无令牌、无 Cookie）
        shell: pwsh
        run: |
          $h = New-Object System.Net.Http.HttpClient
          $h.DefaultRequestHeaders.UserAgent.ParseAdd("wb-e2e-probe/1.0")
          $r = $h.GetAsync("https://github.com/$env:GITHUB_REPOSITORY/releases/latest/download/latest.json").Result
          Write-Host "latest.json 匿名状态码=$([int]$r.StatusCode) 长度=$($r.Content.Headers.ContentLength)"
          if (-not $r.IsSuccessStatusCode) { throw "匿名访问 latest.json 失败：$([int]$r.StatusCode)" }

      # ── 构造低版本构建（带真实 updater 链路的低版本，用于正例/负例驱动）──
      - name: 构造低版本构建（E2E feature + 版本覆盖）
        shell: pwsh
        run: |
          $old = "${{ github.event.inputs.old_version }}"
          if ([string]::IsNullOrWhiteSpace($old)) { $old = "2.0.0" }
          if ($old -notmatch '^\d+\.\d+\.\d+$') { throw "old_version 非法：$old" }
          Write-Host "低版本目标：$old（基线=$env:WB_BASE_VERSION）"
          "WB_OLD_VERSION=$old" | Out-File -Encoding utf8 -Append $env:GITHUB_ENV
          $cfg = [ordered]@{
            version = $old
            bundle = [ordered]@{ createUpdaterArtifacts = $false }
            plugins = [ordered]@{
              updater = [ordered]@{
                endpoints = @("https://github.com/$env:GITHUB_REPOSITORY/releases/latest/download/latest.json")
                pubkey    = (Get-Content "apps/desktop/src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json).plugins.updater.pubkey
                dangerousInsecureTransportProtocol = $true
              }
            }
          }
          $cfg | ConvertTo-Json -Depth 10 | Set-Content -Encoding utf8 "e2e-old.conf.json"
          Push-Location apps/desktop/src-tauri
          cargo tauri build --features e2e-update --config ../../../e2e-old.conf.json --bundles nsis
          if ($LASTEXITCODE -ne 0) { Pop-Location; throw "低版本构建失败" }
          Pop-Location
          $exe = Get-ChildItem "target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $exe) { throw "未找到低版本 NSIS 安装包" }
          Copy-Item $exe.FullName "assets/old-setup.exe" -Force
          Write-Host "低版本安装包：$($exe.Name) = $($exe.Length) 字节"

      # ── 装低版本 ──
      - name: 安装低版本（静默）
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "assets/old-setup.exe" -ArgumentList "/S" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "低版本安装失败，退出码 $($p.ExitCode)" }
          # 低版本构建的产品名就是当前源码名（综合工作台）
          $dir = Join-Path $env:LOCALAPPDATA $env:WB_NEW_PRODUCT
          if (-not (Test-Path $dir)) { throw "未找到安装目录：$dir" }
          Get-ChildItem $dir -Filter "*.exe" | ForEach-Object {
            Write-Host ("  {0}  FileVersion={1}" -f $_.Name, $_.VersionInfo.FileVersion)
          }
          foreach ($k in @(
            "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\$env:WB_NEW_PRODUCT",
            "HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\$env:WB_NEW_PRODUCT")) {
            if (Test-Path $k) { Write-Host "注册表 $k DisplayVersion=$((Get-ItemProperty $k).DisplayVersion)" }
          }

      # ── 夹具：真实副本 + 4 个负例（本地 http，不碰 Release）──
      - name: 构造负例夹具（副本，不改发布物）
        shell: pwsh
        run: |
          # n3 的伪造版本必须与「真实签名里的版本」不同（通常取基线次补丁号，
          # 如基线 2.2.1 → 伪造 2.2.2）。理由：n3 只翻清单 version 字段，
          # 其余 url/signature 仍是真实的；若伪造值 == 基线版本，
          # 「signed for X but announced X」这段判定不会触发，更新插件既不报错
          # 也不终止，负例就永远等不到终态（2026-10-29 run 40829502144 实测卡死）。
          # 曾一度把这里写成 $env:WB_BASE_VERSION，正是上述自相矛盾的情形。
          $parts = $env:WB_BASE_VERSION.Split('.')
          if ($parts.Count -lt 3) { throw "WB_BASE_VERSION 不是三段式：$env:WB_BASE_VERSION" }
          $n3Version = "$($parts[0]).$($parts[1]).$([int]$parts[2] + 1)"
          if ($n3Version -eq $env:WB_BASE_VERSION) { throw "n3 伪造版本与基线相同（$n3Version），负例不成立" }
          Write-Host "n3 伪造清单版本：$n3Version（真实签名版本 $env:WB_BASE_VERSION）"
          python scripts/e2e-make-fixtures.py `
            --manifest "assets/latest.json" `
            --installer "assets/$env:WB_BASE_ASSET" `
            --sig "assets/$env:WB_BASE_ASSET.sig" `
            --out "fixtures" `
            --port 8123 `
            --n3-version $n3Version
          if ($LASTEXITCODE -ne 0) { throw "夹具构造失败" }
          Get-ChildItem -Recurse fixtures | ForEach-Object { Write-Host "  $($_.FullName.Replace($PWD.Path,''))  $($_.Length)B" }

      - name: 启动本地清单服务（127.0.0.1:8123）
        shell: pwsh
        run: |
          # ⚠ 必须用「独立进程」而非 Start-Job：Start-Job 挂在当前 step 的 pwsh 会话上，
          #    step 一结束即被回收，端口随之关闭，后续被测程序会报
          #    "error sending request for url (http://127.0.0.1:8123/...)"，被误判成链路问题。
          $root = Join-Path $PWD "fixtures"
          $py = (Get-Command python).Source
          $srv = Start-Process -FilePath $py -ArgumentList "-m","http.server","8123","--bind","127.0.0.1" `
                 -WorkingDirectory $root -PassThru -WindowStyle Hidden
          $srv.Id | Out-File -Encoding utf8 "fixtures/.serverpid"
          $ok = $false
          for ($i = 0; $i -lt 30; $i++) {
            try {
              $r = Invoke-WebRequest "http://127.0.0.1:8123/real/win.exe" -Method Head -TimeoutSec 2
              if ($r.StatusCode -eq 200) { $ok = $true; break }
            } catch { Start-Sleep -Seconds 1 }
          }
          if (-not $ok) { throw "本地清单服务未就绪（pid=$($srv.Id)，进程存活=$(-not $srv.HasExited)）" }
          Write-Host "本地服务就绪：http://127.0.0.1:8123（pid=$($srv.Id)）"

      # ══ 正例：真实 GitHub 匿名下载 + 钉死清单，全链路 ══
      - name: "正例：检测基线 → 下载 → 验签 → 安装 → 重启后版本确认"
        shell: pwsh
        run: |
          $exe = Join-Path $env:LOCALAPPDATA "$env:WB_NEW_PRODUCT\wb-desktop.exe"
          if (-not (Test-Path $exe)) { throw "未找到低版本主程序：$exe" }
          $result = Join-Path $PWD "evidence/positive.json"
          New-Item -ItemType Directory -Force -Path "evidence" | Out-Null
          $env:WB_E2E_RESULT   = $result
          # 正例的清单改打「本次运行钉死的那一份」（fixtures/real/latest.json，由 step6 按 tag 取到的
          # 同一份清单原样复刻），而不是运行到一半再去拉 GitHub 的实时清单。
          # 原因（2026-10-29 run 40836620836 实测）：WB_BASE_VERSION 在 step6 已按 tag 钉死，
          # 正例若中途读实时清单，发版一旦插进来，插件公告 2.2.2、env 仍是 2.2.1，
          # 就会炸在「未检测到基线版本 2.2.1：2.2.2」——失败的是版本编号的时序，
          # 不是升级链路。当时链路本身是全通的（downloaded_bytes=12371379、verified=true、
          # installer_launched=true、装后 FileVersion 与 DisplayVersion 都是 2.2.2）。
          # 断言一条都没放宽：清单里的 url 仍指向真实 GitHub 资产，下载仍是匿名真下载，
          # 验签仍用真签名，只把「被公告的版本」拉回本次运行钉死的那一版。
          $env:WB_E2E_ENDPOINT = "http://127.0.0.1:8123/real/latest.json"
          $before = (Get-Item $exe).VersionInfo.FileVersion
          Write-Host "启动前 FileVersion=$before（期望 $env:WB_OLD_VERSION）"
          if ($before -notlike "$env:WB_OLD_VERSION*") { throw "低版本未正确安装：期望 $env:WB_OLD_VERSION，实际 $before" }

          $p = Start-Process -FilePath $exe -PassThru
          Write-Host "低版本 PID=$($p.Id)"
          $deadline = (Get-Date).AddMinutes(10)
          while ((Get-Date) -lt $deadline) {
            if (Test-Path $result) {
              $raw = Get-Content $result -Raw
              if ($raw -match "installer_launched" -or $raw -match '"ok":\s*false') { break }
            }
            Start-Sleep -Seconds 3
          }
          if (-not (Test-Path $result)) { throw "正例未产出结果文件（10 分钟超时）" }
          Get-Content $result -Raw | Write-Host

          # 等安装器完成：轮询已装 exe 的 FileVersion 变成基线版本
          $deadline = (Get-Date).AddMinutes(10)
          $now = $null
          while ((Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 5
            if (Test-Path $exe) {
              $now = (Get-Item $exe).VersionInfo.FileVersion
              Write-Host "轮询：已装 FileVersion=$now"
              if ($now -like "$env:WB_BASE_VERSION*") { break }
            }
          }
          $reg = $null
          $k = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\$env:WB_NEW_PRODUCT"
          if (Test-Path $k) { $reg = (Get-ItemProperty $k).DisplayVersion }

          $j = Get-Content $result -Raw | ConvertFrom-Json
          Write-Host "--- 正例判定 ---"
          Write-Host "stage=$($j.stage) ok=$($j.ok) current=$($j.current_version) announced=$($j.announced_version)"
          Write-Host "downloaded_bytes=$($j.downloaded_bytes) verified=$($j.verified) installer_launched=$($j.installer_launched)"
          Write-Host "装上后 FileVersion=$now  DisplayVersion=$reg"

          # install() 成功时插件直接 std::process::exit(0)，落盘的是「安装前」那次写入
          # （含 installer_launched=true，但**不含 stage/ok**），故只在 ok 确实为 false 时判失败。
          if ($j.PSObject.Properties.Name -contains 'ok' -and $j.ok -ne $true) {
            throw "正例链路失败：stage=$($j.stage) error=$($j.error)（原始结果见 evidence/positive.json）"
          }
          if ($j.current_version -notlike "$env:WB_OLD_VERSION*") { throw "current_version 不是 $env:WB_OLD_VERSION：$($j.current_version)" }
          if ($j.announced_version -ne $env:WB_BASE_VERSION) { throw "未检测到基线版本 $env:WB_BASE_VERSION：$($j.announced_version)" }
          if (-not $j.verified) { throw "验签未通过" }
          if (-not $j.installer_launched) { throw "安装器未拉起" }
          if ($now -notlike "$env:WB_BASE_VERSION*") { throw "安装后 FileVersion 不是 $env:WB_BASE_VERSION：$now" }
          if ($reg -notlike "$env:WB_BASE_VERSION*") { throw "注册表 DisplayVersion 不是 $env:WB_BASE_VERSION：$reg" }
          Write-Host "✅ 正例通过：$env:WB_OLD_VERSION → 检测 $env:WB_BASE_VERSION → 下载 → 验签 → 安装 → 版本确认"

      - name: 负例驱动（4 个，全部必须被拒绝）
        shell: pwsh
        run: |
          # 负例必须重新装回低版本：正例已把机器升到基线版本，基线即端点最新版，
          # "检测到更新"会返回 none，负例就失去区分度。
          $probe = $false
          for ($i = 0; $i -lt 15; $i++) {
            try {
              $r = Invoke-WebRequest "http://127.0.0.1:8123/n1/latest.json" -TimeoutSec 3
              if ($r.StatusCode -eq 200) { $probe = $true; break }
            } catch { Start-Sleep -Seconds 1 }
          }
          if (-not $probe) { throw "前置检查失败：本地清单服务不可达（127.0.0.1:8123），不构成负例结论" }

          $env:NO_PROXY = "127.0.0.1,localhost"
          $env:no_proxy = "127.0.0.1,localhost"
          foreach ($k in @("HTTP_PROXY","HTTPS_PROXY","http_proxy","https_proxy","ALL_PROXY","all_proxy")) {
            Remove-Item "Env:$k" -ErrorAction SilentlyContinue
          }

          function Reset-ToOld {
            Get-Process -Name "wb-desktop" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 2
            $p = Start-Process -FilePath "assets/old-setup.exe" -ArgumentList "/S" -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "回滚低版本失败：$($p.ExitCode)" }
            $exe = Join-Path $env:LOCALAPPDATA "$env:WB_NEW_PRODUCT\wb-desktop.exe"
            Write-Host "回滚后 FileVersion=$((Get-Item $exe).VersionInfo.FileVersion)"
          }

          # n3 的期望串来自夹具实际写出的内容（fixtures.json），不在工作流里写版本字面量
          $fx = Get-Content "fixtures/fixtures.json" -Raw | ConvertFrom-Json
          if ([string]::IsNullOrWhiteSpace($fx.n3_expect)) { throw "fixtures.json 缺 n3_expect" }
          Write-Host "n3 期望串（夹具派生）：$($fx.n3_expect)"

          $cases = @(
            @{ name="n1-篡改安装包内容"; endpoint="http://127.0.0.1:8123/n1/latest.json"; expect="signature verification failed"; stage="download" },
            @{ name="n2-篡改签名";       endpoint="http://127.0.0.1:8123/n2/latest.json"; expect="signature verification failed"; stage="download" },
            @{ name="n3-篡改清单版本";   endpoint="http://127.0.0.1:8123/n3/latest.json"; expect=$fx.n3_expect; stage="download" },
            @{ name="n4-篡改清单URL";    endpoint="http://127.0.0.1:8123/n4/latest.json"; expect="Download request failed"; stage="download" }
          )

          $all = @()
          foreach ($c in $cases) {
            Write-Host "`n===== $($c.name) ====="
            Reset-ToOld
            $exe = Join-Path $env:LOCALAPPDATA "$env:WB_NEW_PRODUCT\wb-desktop.exe"
            $result = Join-Path $PWD "evidence/$($c.name).json"
            $env:WB_E2E_RESULT   = $result
            $env:WB_E2E_ENDPOINT = $c.endpoint
            Remove-Item $result -ErrorAction SilentlyContinue
            $p = Start-Process -FilePath $exe -PassThru
            $deadline = (Get-Date).AddMinutes(4)
            $done = $false
            while ((Get-Date) -lt $deadline) {
              if (Test-Path $result) {
                $raw = Get-Content $result -Raw
                if ($raw -match '"ok"\s*:\s*(true|false)') { $done = $true; break }
              }
              Start-Sleep -Seconds 2
            }
            if (-not $done) { throw "$($c.name) 未产出终态结果文件" }
            $j = Get-Content $result -Raw | ConvertFrom-Json
            Write-Host "stage=$($j.stage) ok=$($j.ok) error=$($j.error)"
            if ($j.ok -ne $false) { throw "$($c.name) 没有被拒绝（ok=true），红线不成立" }
            if ($j.stage -ne $c.stage) { throw "$($c.name) 失败阶段不符：期望 $($c.stage)，实际 $($j.stage)" }
            if ($j.error -notlike "*$($c.expect)*") { throw "$($c.name) 错误不可定位：期望含 '$($c.expect)'，实际 '$($j.error)'" }
            Start-Sleep -Seconds 3
            $v = (Get-Item $exe).VersionInfo.FileVersion
            if ($v -notlike "$env:WB_OLD_VERSION*") { throw "$($c.name) 竟然装上了新版本：FileVersion=$v" }
            Write-Host "✅ $($c.name) 被拒绝且版本未变（$v）"
            $all += [pscustomobject]@{ case=$c.name; rejected=$true; stage=$j.stage; error=$j.error; version_after=$v }
          }
          $all | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 "evidence/negatives.json"
          $all | Format-Table -AutoSize | Out-String | Write-Host

      - name: 停本地服务
        if: always()
        shell: pwsh
        run: |
          if (Test-Path "fixtures/.serverpid") {
            $id = [int](Get-Content "fixtures/.serverpid")
            Get-Process -Id $id -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            Write-Host "已停止本地服务进程 pid=$id"
          }
          Get-CimInstance Win32_Process -Filter "Name like 'python%'" |
            Where-Object { $_.CommandLine -like "*http.server*8123*" } |
            ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
          Write-Host "本地服务已停"

      - name: 归档证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: update-e2e-evidence
          path: |
            evidence/
            fixtures/fixtures.json
          if-no-files-found: warn
          retention-days: 30

  # ═══════════════════════════════════════════════════════════════════
  # 升级真机实测：旧名 → 新名 的存量迁移验收（v2.2.1 改名连带风险）
  #
  # 与上面的 e2e 分开成独立 job：上面验「自动更新链路」，这里验「改名迁移」。
  # 两条基线各跑一次（v2.1.0 / v2.2.0），矩阵并行。
  # 判定只读真实产物：卸载注册表项清单、安装目录、快捷方式目标、真实窗口标题。
  # ═══════════════════════════════════════════════════════════════════
  rename-upgrade:
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        base_tag: [v2.1.0, v2.2.0]

    steps:
      - name: 上下文
        shell: pwsh
        run: |
          Write-Host "基线 tag=${{ matrix.base_tag }}"
          Write-Host "run=$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"

      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: 安装 tauri-cli
        shell: pwsh
        run: cargo install tauri-cli --version "^2" --locked

      - name: 取新包配置（产品名/版本）
        shell: pwsh
        run: |
          $c = Get-Content "apps/desktop/src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json
          "WB_NEW_PRODUCT=$($c.productName)" | Out-File -Encoding utf8 -Append $env:GITHUB_ENV
          "WB_NEW_VERSION=$($c.version)"     | Out-File -Encoding utf8 -Append $env:GITHUB_ENV
          "WB_NEW_IDENT=$($c.identifier)"    | Out-File -Encoding utf8 -Append $env:GITHUB_ENV
          Write-Host "新包：name=$($c.productName) version=$($c.version) id=$($c.identifier)"

      # ── 构建并安装 v2.2.1（新名）──
      - name: 构建新包 v2.2.1（签名私钥走环境变量）
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          Push-Location apps/desktop/src-tauri
          cargo tauri build --bundles nsis
          if ($LASTEXITCODE -ne 0) { Pop-Location; throw "新包构建失败" }
          Pop-Location
          $exe = Get-ChildItem "target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $exe) { throw "未找到新包 NSIS 安装包" }
          Copy-Item $exe.FullName "new-setup.exe" -Force
          Write-Host "新包：$($exe.Name) = $($exe.Length) 字节"

      # ── 装基线（旧名），并留存装前状态 ──
      - name: 安装基线 ${{ matrix.base_tag }}（旧名）
        shell: pwsh
        run: |
          $tag = "${{ matrix.base_tag }}"
          $ver = $tag.TrimStart('v')
          $name = "workbench_${ver}_x64-setup.exe"
          New-Item -ItemType Directory -Force -Path base | Out-Null
          $url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$tag/$name"
          curl.exe -sS -L --max-time 300 -o "base/$name" -w "HTTP %{http_code} %{size_download}B`n" $url
          if ($LASTEXITCODE -ne 0) { throw "下载基线安装包失败：$url" }
          $vi = (Get-Item "base/$name").VersionInfo
          $oldProduct = $vi.ProductName
          if ([string]::IsNullOrWhiteSpace($oldProduct)) { throw "基线包 ProductName 读取失败" }
          Write-Host "基线包：ProductName=$oldProduct FileVersion=$($vi.FileVersion)"
          "WB_OLD_PRODUCT=$oldProduct" | Out-File -Encoding utf8 -Append $env:GITHUB_ENV

          # 装前清场：机器上不应有同名残留（干净的基线）
          Get-Process -Name "wb-desktop" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath "base/$name" -ArgumentList "/S" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "基线安装失败：$($p.ExitCode)" }

          $dir = Join-Path $env:LOCALAPPDATA $oldProduct
          if (-not (Test-Path $dir)) { throw "基线安装目录不存在：$dir" }
          Write-Host "基线安装目录：$dir"
          # 留证：装前的旧卸载项、旧桌面图标目标
          $before = [ordered]@{}
          $before.dir = $dir
          $before.dir_exe = (Join-Path $dir "wb-desktop.exe")
          $before.dir_exe_exists = (Test-Path $before.dir_exe)
          $before.uninst_hkcu = (Test-Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\$oldProduct")
          $before.uninst_hklm = (Test-Path "HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\$oldProduct")
          $lnk = Join-Path ([Environment]::GetFolderPath("Desktop")) "$oldProduct.lnk"
          $before.desktop_lnk = $lnk
          $before.desktop_lnk_exists = (Test-Path $lnk)
          if ($before.desktop_lnk_exists) {
            $sh = New-Object -ComObject WScript.Shell
            $before.desktop_lnk_target = $sh.CreateShortcut($lnk).TargetPath
          }
          $before | ConvertTo-Json -Depth 4 | Set-Content -Encoding utf8 "evidence-before.json"
          $before | ConvertTo-Json -Depth 4 | Write-Host

      # ── 走自动更新路径安装新包（/P /UPDATE /R，与线上用户完全一致）──
      - name: 以自动更新方式装 v2.2.1（passive + UPDATE + 重启）
        shell: pwsh
        run: |
          # 这是线上用户的真实到达方式：tauri 插件拉起安装器时带 /P /UPDATE /R。
          # 必须走这条，才验得到「/UPDATE 不卸载旧版」这个根因是否已被钩子修复。
          Get-Process -Name "wb-desktop" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2
          # 不能对安装器用 Start-Process -Wait：PS7 的 -Wait 会等「进程及其全部子进程」，
          # 而 /R 会让安装器在 .onInstSuccess 里把 wb-desktop.exe 拉起来（常驻 GUI），
          # -Wait 于是永不返回（实测卡死 25 分钟无输出，2026-10-29）。
          # 这里只等安装器本身退出，退出码断言一字不改。
          $p = Start-Process -FilePath "new-setup.exe" -ArgumentList "/P","/UPDATE","/R" -PassThru
          $deadline = (Get-Date).AddMinutes(10)
          while ((-not $p.HasExited) -and ((Get-Date) -lt $deadline)) { Start-Sleep -Milliseconds 500 }
          if (-not $p.HasExited) {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            throw "新包安装器未在 10 分钟内退出（pid=$($p.Id)）"
          }
          $p.WaitForExit()  # 只回收安装器进程自身，不牵连它 /R 拉起的应用
          Write-Host "新包安装器退出码=$($p.ExitCode)"
          if ($p.ExitCode -ne 0) { throw "新包安装失败：$($p.ExitCode)" }
          Start-Sleep -Seconds 5

      # ── 验收：单份安装 / 快捷方式 / 界面标题 ──
      - name: 验收改名迁移（单份安装 + 新快捷方式 + 界面标题）
        shell: pwsh
        run: |
          $fail = @()
          $ev = [ordered]@{}
          $old = $env:WB_OLD_PRODUCT
          $new = $env:WB_NEW_PRODUCT

          # ① 单份安装：旧卸载项必须消失
          foreach ($root in @("HKCU","HKLM")) {
            $oldKey = "${root}:\Software\Microsoft\Windows\CurrentVersion\Uninstall\$old"
            $oldExists = Test-Path $oldKey
            $ev["old_uninst_${root}_exists"] = $oldExists
            if ($oldExists) { $fail += "旧卸载项仍存在：$oldKey" }
          }
          # ①b 新卸载项必须存在且只有一套
          $newKey = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\$new"
          $newExists = Test-Path $newKey
          $ev["new_uninst_HKCU_exists"] = $newExists
          if (-not $newExists) { $fail += "新卸载项不存在：$newKey" }
          if ($newExists) { $ev["new_display_version"] = (Get-ItemProperty $newKey).DisplayVersion }
          if ($ev["new_display_version"] -notlike "$env:WB_NEW_VERSION*") {
            $fail += "新卸载项 DisplayVersion=$($ev['new_display_version']) 不是 $env:WB_NEW_VERSION"
          }
          # ①c 两套卸载项总数：旧名+新名同时存在即为双安装
          $bothNames = @()
          foreach ($root in @("HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall","HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall")) {
            if (Test-Path $root) {
              Get-ChildItem $root | ForEach-Object {
                $dn = (Get-ItemProperty $_.PSPath -ErrorAction SilentlyContinue).DisplayName
                if ($dn -eq $old -or $dn -eq $new) { $bothNames += "$root\$($_.PSChildName)=$dn" }
              }
            }
          }
          $ev["displayname_entries"] = $bothNames
          if ($bothNames.Count -ne 1) { $fail += "卸载项不是恰好一条（实际 $($bothNames.Count)）：$($bothNames -join '; ')" }

          # ② 旧目录必须消失，新目录必须存在
          $oldDir = Join-Path $env:LOCALAPPDATA $old
          $newDir = Join-Path $env:LOCALAPPDATA $new
          $ev["old_dir_exists"] = Test-Path $oldDir
          $ev["new_dir_exists"] = Test-Path $newDir
          $ev["new_dir_exe_exists"] = Test-Path (Join-Path $newDir "wb-desktop.exe")
          if (Test-Path $oldDir) { $fail += "旧安装目录仍存在：$oldDir" }
          if (-not (Test-Path (Join-Path $newDir "wb-desktop.exe"))) { $fail += "新安装目录缺主程序：$newDir" }

          # ③ 桌面快捷方式：必须新名、且指向新目录
          $desk = [Environment]::GetFolderPath("Desktop")
          $oldLnk = Join-Path $desk "$old.lnk"
          $newLnk = Join-Path $desk "$new.lnk"
          $ev["old_lnk_exists"] = Test-Path $oldLnk
          $ev["new_lnk_exists"] = Test-Path $newLnk
          if (Test-Path $oldLnk) { $fail += "旧桌面图标仍存在：$oldLnk" }
          if (-not (Test-Path $newLnk)) {
            $fail += "新桌面图标不存在：$newLnk（/UPDATE 不建快捷方式，须由钩子补建）"
          } else {
            # 为什么不用 WScript.Shell 读 TargetPath：2026-10-29 实测（run 40820493314），
            # 该 COM 在本 runner 上对「基线 v2.1.0 安装器自己创建的桌面图标」同样读出空串
            # （evidence-before.json: desktop_lnk_target=""），说明读空是环境/读取层问题，
            # 不能据此判定 lnk 没写目标。改为直接解析 .lnk 二进制：目标（LocalBasePath）
            # 以 UTF-16LE 逐字存在文件内，断言不放宽——新目录完整路径必须出现在 lnk 里。
            $bytes = [IO.File]::ReadAllBytes($newLnk)
            $ev["new_lnk_size"] = $bytes.Length
            $target = Join-Path $newDir "wb-desktop.exe"
            $hit = $false
            foreach ($off in 0, 1) {
              if ($off -ge $bytes.Length) { continue }
              $s = [Text.Encoding]::Unicode.GetString($bytes, $off, $bytes.Length - $off)
              if ($s.IndexOf($target, [StringComparison]::OrdinalIgnoreCase) -ge 0) { $hit = $true }
            }
            # 对照留痕（不作断言依据）：WScript COM 读到的值，预期与基线快照一样为空
            try {
              $sh = New-Object -ComObject WScript.Shell
              $ev["new_lnk_target_wscript"] = $sh.CreateShortcut($newLnk).TargetPath
            } catch {
              $ev["new_lnk_target_wscript"] = "COM-ERROR: $($_.Exception.Message)"
            }
            $ev["new_lnk_target_expected"] = $target
            $ev["new_lnk_target_binary_hit"] = $hit
            if (-not $hit) {
              $fail += "新桌面图标未指向新目录：lnk 二进制（$($bytes.Length) 字节）中未找到目标 $target"
            }
            # lnk 本体留证：失败时可离线复核 LocalBasePath 是否真的缺失
            Copy-Item $newLnk -Destination "evidence-new-desktop.lnk" -ErrorAction SilentlyContinue
          }

          # ④ 界面标题：启动应用，读真实窗口标题
          $exe = Join-Path $newDir "wb-desktop.exe"
          Get-Process -Name "wb-desktop" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2
          $proc = Start-Process -FilePath $exe -PassThru
          # 用 -TypeDefinition（可在源码里 using System.Runtime.InteropServices）；
          # -MemberDefinition 不支持 -UsingNamespace，写成那样会直接抛参数错误。
          Add-Type -TypeDefinition @"
          using System;
          using System.Collections.Generic;
          using System.Runtime.InteropServices;
          using System.Text;
          public static class WBTWin {
            public delegate bool EnumProc(IntPtr h, IntPtr l);
            [DllImport("user32.dll")] static extern bool EnumWindows(EnumProc cb, IntPtr l);
            [DllImport("user32.dll")] static extern uint GetWindowThreadProcessId(IntPtr h, out uint p);
            [DllImport("user32.dll", CharSet=CharSet.Unicode)] static extern int GetWindowText(IntPtr h, StringBuilder s, int n);
            [DllImport("user32.dll", CharSet=CharSet.Unicode)] static extern int GetClassName(IntPtr h, StringBuilder s, int n);
            [DllImport("user32.dll")] static extern bool IsWindowVisible(IntPtr h);
            public static List<string> Titles(int pid) {
              var r = new List<string>();
              EnumWindows(delegate(IntPtr h, IntPtr l) {
                uint wp; GetWindowThreadProcessId(h, out wp);
                if (wp == (uint)pid && IsWindowVisible(h)) {
                  var t = new StringBuilder(256); GetWindowText(h, t, 256);
                  var c = new StringBuilder(256); GetClassName(h, c, 256);
                  // 跳过插件仲裁窗（-sic/-siw）与无标题窗
                  if (t.Length > 0 && !c.ToString().EndsWith("-sic") && !c.ToString().EndsWith("-siw"))
                    r.Add(t.ToString());
                }
                return true;
              }, IntPtr.Zero);
              return r;
            }
          }
          "@
          $titles = @()
          for ($i = 0; $i -lt 40; $i++) {
            Start-Sleep -Milliseconds 500
            $titles = [WBTWin]::Titles($proc.Id)
            if ($titles.Count -gt 0) { break }
          }
          $ev["window_titles"] = $titles
          $expectTitle = "$new · 安徽省"
          if (-not ($titles | Where-Object { $_ -eq $expectTitle })) {
            $fail += "界面标题不是「$expectTitle」，实际：$($titles -join ' / ')"
          }
          # 标题里不允许再出现旧名（两名字并存即失败）
          if ($titles | Where-Object { $_ -like "*$old*" }) { $fail += "界面标题仍含旧名：$($titles -join ' / ')" }

          Get-Process -Id $proc.Id -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          $ev | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 "evidence-after.json"
          $ev | ConvertTo-Json -Depth 5 | Write-Host

          if ($fail.Count -gt 0) {
            throw ("改名迁移验收失败（基线 ${{ matrix.base_tag }}）：`n - " + ($fail -join "`n - "))
          }
          Write-Host "✅ 改名迁移验收通过（基线 ${{ matrix.base_tag }} → $env:WB_NEW_VERSION）"

      - name: 归档证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rename-upgrade-${{ matrix.base_tag }}
          path: |
            evidence-before.json
            evidence-after.json
            evidence-new-desktop.lnk
          if-no-files-found: warn
          retention-days: 30
