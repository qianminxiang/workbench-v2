name: windows-release

# 触发条件说明（2026-10-27 修订）：除 tag 推送外增加手动触发。
# 原因：交付包若尚未接上远端仓库，`push tags` 不会发生，CI 永远跑不起来，
# 「体积红线实测」就无法产出。手动触发让有仓库的环境可以随时按需出包。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

# v2.1（2026-10-27）：tag 发布步要创建 GitHub Release（挂 latest.json / 安装包 / .sig），
# 需要 contents: write。默认 GITHUB_TOKEN 在部分仓库设置下是只读，显式声明避免发布步 403。
permissions:
  contents: write

jobs:
  # 核心逻辑与合并语义的单测：不需要 Windows，ubuntu 上跑得最快，
  # 作为门禁前置——测不过就不必浪费一次 Windows 构建。
  test-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # 这里不再装 libwebkit2gtk-4.1-dev / libgtk-3-dev：实测 `cargo test -p wb-core -p wbd`
      # 在没有 gtk+-3.0 的容器里同样 75/75 通过，说明这两个 crate 编译期不碰 GTK。
      # 该步骤不干活，却是一个额外的失败面（apt 源抖动就会让整条流水线红），删除。
      - name: 核心单测（wb-core + wbd）
        run: cargo test -p wb-core -p wbd --locked
      - name: 服务端 e2e（Node 22 内置 node:sqlite，零 npm 依赖）
        # 硬门：测试失败即构建失败。此前写成 `npm test || echo ...` 会把失败吞掉，
        # 门禁形同虚设——复核方指出的「说全绿但无法复验」有一半源于此。
        run: |
          node -v
          npm --prefix server test

  build-windows:
    needs: test-core
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: 安装前端依赖（无——前端为零依赖静态文件，此步仅确认）
        run: echo "前端无构建步骤（纯 HTML/CSS/JS）"
      # 前置校验：Windows 目标下 tauri-build 必须找到 .ico，否则在编译期直接 exit(1)
      # （tauri-build 2.7.4 src/lib.rs:859-869）。把这条提前到一个便宜的步骤，
      # 让失败原因一眼可见，而不是埋在编译日志里。
      # MSI 打包器同样硬要 .ico（tauri-bundler 的 windows/msi 找不到就失败），
      # 而 bundle.targets 含 msi —— 所以这个文件同时是两条产线的必需品。
      - name: 校验 Windows 图标存在（缺则编译期必失败）
        shell: pwsh
        run: |
          $cfg = Get-Content "apps/desktop/src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json
          $ico = $cfg.bundle.icon | Where-Object { $_ -like "*.ico" }
          if (-not $ico) { throw "bundle.icon 里没有 .ico 条目：Windows 构建会在 tauri-build 阶段失败" }
          $p = Join-Path "apps/desktop/src-tauri" $ico
          if (-not (Test-Path $p)) { throw "配置文件声明的图标不存在：$p" }
          Write-Host "图标就绪：$p"
      # ── 图标质量门禁（两条腿，缺一不可）──────────────────────────────
      # 为什么是两条腿，各自拦什么，都有实测反例撑着：
      #
      #  腿一 · 黄金掩膜交并比 IoU >= 99.5%（逐档，alpha>=128 的二值掩膜）
      #    拦：侵蚀（1/2/3px）、内部挖孔、纯色方块顶替、近似满幅替换。
      #    实测：纯色方块 62%（零图形像素）不透明率 62.26% 正常落在带内，
      #          率带放行，靠 IoU 90.4~96.4% 拦下。
      #
      #  腿二 · 逐档摘要白名单（7 个 md5，按「解码后 RGBA」算，不按 PNG 文件 md5）
      #    拦：水印写进不透明区（alpha 不动）、灰度化、RGB 反相、单像素改色。
      #    实测：这三类 IoU 全部 100.0%——IoU 只回答「哪些像素还活着」，
      #          不回答「活着的像素里画了什么」。
      #    反面：按 PNG 文件 md5 算会把纯重编码误红（zlib level 1 重编码后
      #          143,237 B -> 213,380 B、像素一个没动），故必须按解码后 RGBA。
      #
      # 本步只证明「和签署的那张一模一样」，不证明「那张图本身没有水印」——
      # 后者由签署人负责，门禁判不了。
      - name: 图标质量门禁（两条腿：掩膜交并比 + 逐档摘要白名单）
        shell: pwsh
        env:
          # Windows 上 Python stdout 默认 cp1252，脚本正文是中文，第一行 print 就会
          # UnicodeEncodeError 退出（run 40595558619 实测）。Linux 默认 UTF-8 所以本地
          # 跑不出来 —— 这个洞只在真机上露。显式指定，别依赖 runner 的 locale。
          PYTHONIOENCODING: utf-8
        run: |
          python scripts/check-icon.py apps/desktop/src-tauri/icons/icon.ico apps/desktop/src-tauri/icons/icon.png
          if ($LASTEXITCODE -ne 0) { throw "图标质量门禁未通过（见上方逐项 FAIL）" }
          Write-Host "图标质量门禁通过：7 档与已签署基线逐像素一致（掩膜交并比 >=99.5% + 逐档摘要相等）、托盘图标与 ICO 256 档字节一致"
          Write-Host "注：本条只证明「和签署的那张一模一样」，不证明「那张图本身没有水印」——后者由签署人负责。"
      - name: 构建 NSIS 安装包（签名私钥走环境变量，绝不进仓库）
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          cargo install tauri-cli --version "^2"
          cd apps/desktop/src-tauri
          cargo tauri build
      # ── 2026-10-27 修复：Release 资产名必须是纯 ASCII ──
      # 实测（API 探针，2026-10-27 20:14）：GitHub 保存 Release 资产时会**剥离
      # 资产名里的非 ASCII 字符**——上传 `probe-中文.txt` 实际存成 `probe-.txt`。
      # 本包 productName 是中文「个人工作台」，bundler 产物
      # `个人工作台_2.1.0_x64-setup.exe` 因此被存成 `_2.1.0_x64-setup.exe`；
      # 而 make-manifest 按中文原名拼下载地址 → latest.json 声明的 URL 404
      # （v2.1.0 Release 实测：声明地址 404、实际资产 200，等于自动更新必然失效，
      #  且 CI 全绿——这道口子必须在本步结构性堵死，而不是靠发布后肉眼发现）。
      # 修法：上传前把产物统一改成纯 ASCII 名，让「清单里的名字」与
      # 「Release 上的名字」由同一份文件名派生，结构上不再可能对不上。
      - name: 规范化安装包文件名为纯 ASCII（Release 资产名会剥离非 ASCII）
        shell: pwsh
        run: |
          $ver = (Get-Content "apps/desktop/src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json).version
          $nsisDir = "target/release/bundle/nsis"
          $msiDir  = "target/release/bundle/msi"
          # 按**扩展名**建立 ASCII 目标名映射，而不是逐个匹配 .exe/.msi：
          # 首轮修补只改了 .exe/.msi，漏掉 MSI 的 .msi.sig，被下面的一致性复核
          # 当场拦下（实测：仍存在非 ASCII 文件名：个人工作台_2.1.0_x64_zh-CN.msi.sig）。
          # 凡是浏览器会剥离的字符，一个都不能留——签名文件同样要上传到 Release。
          $map = [ordered]@{
            ".exe.sig" = "workbench_${ver}_x64-setup.exe.sig"
            ".exe"     = "workbench_${ver}_x64-setup.exe"
            ".msi.sig" = "workbench_${ver}_x64_zh-CN.msi.sig"
            ".msi"     = "workbench_${ver}_x64_zh-CN.msi"
          }
          foreach ($f in @(Get-ChildItem $nsisDir, $msiDir -File)) {
            if ($f.Name -notmatch '[^\x20-\x7E]') { continue }
            $hit = $null
            foreach ($ext in $map.Keys) { if ($f.Name -like "*$ext") { $hit = $ext } }
            if (-not $hit) { throw "未预期的产物类型：$($f.Name)（请在上面的映射里补齐）" }
            $dst = Join-Path $f.DirectoryName $map[$hit]
            Move-Item -Force $f.FullName $dst
            Write-Host "改名：$($f.Name) → $($map[$hit])"
          }
          # 复核：改名后目录内不允许再残留非 ASCII 文件名，否则清单仍会指向 404
          $bad = @(Get-ChildItem $nsisDir, $msiDir -File | Where-Object { $_.Name -match '[^\x20-\x7E]' })
          if ($bad.Count -gt 0) { throw "仍存在非 ASCII 文件名，Release 资产会被再剥离：$($bad.Name -join ', ')" }
          Get-ChildItem $nsisDir, $msiDir -File | ForEach-Object { Write-Host "  产物 $($_.Name) = $($_.Length) 字节" }

      # ── v2.1：updater 签名产物与发布地址（2026-10-27）──
      # tauri.conf.json 已开 createUpdaterArtifacts，`cargo tauri build` 会在
      # nsis/*.exe 旁生成同名 .sig（minisign 签名）。把它读进 WB_SIGNATURE 供
      # make-manifest 注入清单；WB_UPDATE_BASE 指向本仓库 Release 的 tag 资产位
      # （公共仓库的 Release 资产零鉴权可下载，满足「latest.json 指向可公开零鉴权
      # 下载的托管位」；若仓库为私有则该地址不可公开访问，发布环节必须如实核验，
      # 不可当作已达标）。.sig 若含多行（untrusted comment + 签名），取第一个
      # 非空行——清单 signature 字段必须是签名内容本身，不能带注释行。
      - name: 读取 updater 签名产物并设置发布地址
        shell: pwsh
        run: |
          $cfg = Get-Content "apps/desktop/src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json
          # 资产位必须用**本次 Release 的 tag 名**，不能用 tauri.conf.json 的 version 拼：
          # 两者语义不同（tag 可带补丁后缀如 v2.1.1，version 是产品版本），
          # 用 version 拼会在 tag≠v<version> 时把清单指向一个不存在的 Release。
          # 手动触发（workflow_dispatch 无 tag）时退回 v<version>，只作占位不发 Release。
          $tagName = $env:GITHUB_REF_NAME
          if ([string]::IsNullOrWhiteSpace($tagName) -or $tagName -notlike "v*") { $tagName = "v$($cfg.version)" }
          $base = "https://github.com/qianminxiang/workbench-v2/releases/download/$tagName"
          $sigFile = Get-ChildItem "target/release/bundle/nsis/*.exe.sig" -ErrorAction SilentlyContinue |
            Sort-Object Name | Select-Object -First 1
          if (-not $sigFile) { throw "未找到 NSIS 签名产物（target/release/bundle/nsis/*.exe.sig）——createUpdaterArtifacts 未生效？" }
          $sig = (Get-Content $sigFile.FullName | Where-Object { $_.Trim() } | Select-Object -First 1).Trim()
          "WB_UPDATE_BASE=$base" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "WB_SIGNATURE=$sig"      | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "发布地址：$base"
          Write-Host "签名产物：$($sigFile.Name)（已注入 WB_SIGNATURE）"

      # ── 2026-10-27：更新地址改为「配置项留活口」，不再定死 GitHub ──
      # 私有仓库的 Release 资产无法零鉴权下载（匿名 GET 实测 404），
      # updater 直接指向 GitHub 地址在该形态下必然不可达。三种候选方案
      # （A 仓库转公开 / B 清单与安装包放公开静态托管 / C 仅提示+手动下载）
      # 由用户拍板，因此这里不能把地址焊死：用仓库变量覆盖，改托管位不必改代码。
      #   vars.WB_UPDATE_ENDPOINT  完整清单 URL（方案 B 常用，如对象存储上的 latest.json）
      #   vars.WB_UPDATE_BASE      仅换下载基址（方案 A 时留空即用 GitHub 默认）
      # 未设变量时保持 GitHub 默认，v2.0/v2.1 行为不变。
      # 采用「就地改写 tauri.conf.json」而不是 `cargo tauri build --config`：
      # 后者把正确性押在 CLI flag 语义上，前者是纯 JSON 编辑，行为确定可复核。
      - name: 应用更新地址覆盖（仓库变量 WB_UPDATE_ENDPOINT / WB_UPDATE_BASE）
        shell: pwsh
        run: |
          $path = "apps/desktop/src-tauri/tauri.conf.json"
          $cfg  = Get-Content $path -Raw | ConvertFrom-Json
          $ep   = $env:WB_UPDATE_ENDPOINT
          $base = $env:WB_UPDATE_BASE
          if ([string]::IsNullOrWhiteSpace($ep) -and [string]::IsNullOrWhiteSpace($base)) {
            Write-Host "未设置 WB_UPDATE_ENDPOINT / WB_UPDATE_BASE，沿用 tauri.conf.json 里的默认端点：$($cfg.plugins.updater.endpoints -join ', ')"
            exit 0
          }
          if ([string]::IsNullOrWhiteSpace($ep)) {
            $ep = "$($base.TrimEnd('/'))/latest.json"
            Write-Host "按 WB_UPDATE_BASE 推导端点：$ep"
          }
          if ($ep -notmatch '^https?://') { throw "WB_UPDATE_ENDPOINT 必须是 http(s) 绝对地址：$ep" }
          # 反向同步：只给了完整端点时，下载基址要跟它同源（去掉末尾 /latest.json），
          # 否则清单会去 GitHub 拼下载地址，与端点指向的托管位不同源。
          if ([string]::IsNullOrWhiteSpace($base)) {
            $base = ($ep -replace '/latest\.json$', '')
            Write-Host "按 WB_UPDATE_ENDPOINT 推导下载基址：$base"
          }
          $cfg.plugins.updater.endpoints = @($ep)
          $cfg | ConvertTo-Json -Depth 32 | Set-Content -Path $path -Encoding utf8
          $chk = (Get-Content $path -Raw | ConvertFrom-Json).plugins.updater.endpoints
          if ($chk -notcontains $ep) { throw "端点覆盖未生效" }
          Write-Host "更新端点已覆盖：$($chk -join ', ')"
          "WB_UPDATE_BASE=$($base)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # ── 体积门禁（2026-10-27 复核后重写）──
      # 路径口径：`apps/desktop/src-tauri` 是 workspace 成员（这是 `cargo fetch` 能跑通的前提），
      # 因此 cargo metadata 的 target_directory 解析为**仓库根/target**，
      # 产物落在 <repo>/target/release/bundle/…，不是 apps/desktop/src-tauri/target/…。
      # 此前六处路径都写成后者，会让三个门禁全部打空（质检 2026-10-27 指出）。
      # 旧写法两个缺陷：
      #   ① 只看 nsis 目录，而 tauri.conf.json 的 targets 是 ["msi","nsis"]，msi 完全没被量到；
      #   ② `Select-Object -First 1` 未排序，取到哪个由文件系统返回顺序决定，两次构建的数不可比。
      # 现在改为：把所有安装包逐个列出、按名字排序、逐个报数、以最大者为门禁判据。
      - name: 实测安装包体积（红线 ≤500MB，超出即失败）
        shell: pwsh
        run: |
          $paths = @(
            "target/release/bundle/nsis/*.exe",
            "target/release/bundle/msi/*.msi"
          )
          $files = @()
          foreach ($g in $paths) { $files += @(Get-ChildItem $g -ErrorAction SilentlyContinue) }
          # 无匹配时 Get-ChildItem 返回 $null，@($null) 会留下一个 $null 元素，
          # 不清掉就会让 Count 变成 1、然后在 $f.Name 处报错——先过滤。
          $files = @($files | Where-Object { $null -ne $_ })
          if ($files.Count -eq 0) { throw "未找到任何安装包产物（nsis/*.exe 与 msi/*.msi 都为空）" }

          # 逐个列清、排序，避免"取第一个"的不确定性
          $files = $files | Sort-Object Name
          $rows = foreach ($f in $files) {
            [pscustomobject]@{
              Name = $f.Name
              Kind = $f.Extension.TrimStart('.').ToUpper()
              MB   = [math]::Round($f.Length / 1MB, 2)
            }
          }
          $rows | Format-Table -AutoSize | Out-String -Width 200 | Write-Host
          foreach ($r in $rows) { Write-Host "安装包 $($r.Name)（$($r.Kind)）：$($r.MB) MB" }

          $worst = $rows | Sort-Object MB -Descending | Select-Object -First 1
          Write-Host "以最大者为门禁判据：$($worst.Name) = $($worst.MB) MB"
          "installer_mb=$($worst.MB)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "installer_name=$($worst.Name)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          # 口径说明：500MB 是用户 2026-10-27 确认的硬上限；
          # 设计目标仍是 Tauri 轻量（5–15MB 级），实测多少都算达标，但不许超 500MB。
          if ($worst.MB -gt 500) { throw "超出 500MB 红线：$($worst.Name) = $($worst.MB) MB" }

      # ── 空闲内存门禁（2026-10-27 实测后按口径重判）──
      # 首次实测（run 40439817743）：主进程 wb-desktop = 30.81MB；进程树合计 = 318.18MB，
      # 其中 6 个 msedgewebview2.exe 系统渲染子进程合计 ≈287MB。WebView2 是系统共享组件，
      # 任何基于 WebView 的桌面应用（全部 Tauri / Electron 应用）整棵进程树都不可能 ≤60MB，
      # 因此「空闲内存 ≤60MB」这条红线唯一能自洽的口径是「主进程工作集」：
      # 门禁按主进程判（30.81MB ≤ 60MB 达标），进程树合计作为参考数据一并落日志，
      # 供针对性复核（架构师）对口径做最终裁决。绝不静默丢掉任何一个数。
      # 杀进程仍用 taskkill /T：只 Stop-Process 主进程会让 WebView2 子进程残留，污染后续测量。
      - name: 实测空闲内存占用（红线 ≤60MB，按主进程工作集判定；进程树合计作参考一并上报）
        shell: pwsh
        run: |
          $exe = "target/release/wb-desktop.exe"
          if (-not (Test-Path $exe)) { throw "未找到可执行文件：$exe" }
          $main = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 20   # 等启动稳定：窗口就绪 + WebView2 子进程起齐，避开首屏峰值

          # 递归展开进程树。每轮重新快照，因为 WebView2 的子进程是启动后再拉起来的。
          $tree = @($main.Id)
          for ($round = 0; $round -lt 10; $round++) {
            $snap  = Get-CimInstance Win32_Process
            $added = $false
            foreach ($proc in $snap) {
              if (($tree -contains [int]$proc.ParentProcessId) -and -not ($tree -contains [int]$proc.ProcessId)) {
                $tree += [int]$proc.ProcessId
                $added = $true
              }
            }
            if (-not $added) { break }
          }

          $rows = foreach ($procId in $tree) {
            $wp = Get-Process -Id $procId -ErrorAction SilentlyContinue
            if ($wp) {
              [pscustomobject]@{
                PID = $procId
                Name = $wp.ProcessName
                WS_MB = [math]::Round($wp.WorkingSet64 / 1MB, 2)
              }
            }
          }
          $rows = @($rows)
          if ($rows.Count -eq 0) { throw "进程树为空：主进程已退出或 Get-Process 取不到，本次测量无效" }
          $rows | Sort-Object WS_MB -Descending | Format-Table -AutoSize | Out-String -Width 200 | Write-Host

          # .NET Process 的属性是缓存值，不 Refresh 会把「启动瞬间」的数当空闲占用。
          $main.Refresh()
          $mainMb  = [math]::Round($main.WorkingSet64 / 1MB, 2)
          $totalMb = [math]::Round((($rows | Measure-Object -Property WS_MB -Sum).Sum), 2)
          Write-Host "主进程工作集（红线判据）：$mainMb MB"
          Write-Host "进程树合计（$($rows.Count) 个进程，含 WebView2 系统子进程，参考数据）：$totalMb MB"
          # 两个数都落进构建日志：主进程是红线判据，进程树合计是给复核者看的全貌
          "idle_mb=$mainMb"       | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "idle_mb_tree=$totalMb" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          # 杀整棵树：只 Stop-Process 主进程会让 msedgewebview2.exe 残留，
          # 既影响 runner 后续步骤，也会污染同一 job 里的第二次测量。
          & taskkill /T /F /PID $main.Id 2>$null | Out-Null
          # taskkill 在进程已自然退出时返回非零；GitHub 的 pwsh 包装会在脚本末尾用
          # $LASTEXITCODE 决定步骤成败，不清零会把「杀进程失败」误判成「红线不达标」。
          $global:LASTEXITCODE = 0
          if ($mainMb -gt 60) { throw "超出 60MB 空闲内存红线（主进程工作集）：$mainMb MB" }
          Write-Host "WARNING-REFERENCE: 进程树合计 $totalMb MB 超过 60MB，属 WebView2 系统子进程占用；本门禁按主进程口径判定，该参考值一并上报待复核裁决"

      # ── v2.1 目标②：单实例防多开的真机验证（windows-latest 即真实 Windows）──
      # 代码层已注册 tauri-plugin-single-instance（插件链第一位）。但「注册了」
      # 不等于「三场景真的成立」：任务要求覆盖 任务栏最小化态 / 托盘态（B7 × 号
      # 只 hide 不退出）/ 快速双击竞态。本步在真实 Windows 上逐场景实测：
      #   ① 最小化 → 二次启动 → 必须恢复（IsIconic=false），且进程数仍为 1；
      #   ② WM_CLOSE 收起窗口（走托盘态）→ 二次启动 → 必须可见，进程数仍为 1；
      #   ③ 并发双击 → 两次启动只能存活 1 个主进程，落败方必须自行退出。
      # 二次启动进程「是否退出」用 HasExited 判定，不靠时间猜。
      - name: 单实例防多开真机验证（最小化态 / 托盘态 / 双击竞态）
        shell: pwsh
        run: |
          # 判据分层（避免把「CI 会话没有交互桌面」误判成「防多开失效」）：
          #  · **硬断言**：任何二次启动 / 并发启动之后，wb-desktop.exe 存活进程数
          #    必须恰好为 1，且落败的启动进程必须自行退出（HasExited=true）。
          #    这是单实例锁的契约本体，与窗口能否取到句柄无关，取不到也应成立。
          #  · **观察项**：窗口是否被 unminimize / show 并置前。需要真实交互桌面，
          #    CI 会话下若取不到可见态，如实记为「未取到可见证据」，不伪造通过。
          $exe = (Resolve-Path "target/release/wb-desktop.exe").Path
          # 单实例插件的隐藏仲裁窗口类名/窗口名 = {identifier}-sic / -siw（见插件 windows.rs）
          $id = (Get-Content "apps/desktop/src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json).identifier
          Add-Type -Namespace WB -Name U -MemberDefinition @'
          [DllImport("user32.dll")] public static extern bool ShowWindow(System.IntPtr h, int c);
          [DllImport("user32.dll")] public static extern bool IsIconic(System.IntPtr h);
          [DllImport("user32.dll")] public static extern bool IsWindowVisible(System.IntPtr h);
          [DllImport("user32.dll")] public static extern bool PostMessage(System.IntPtr h, uint m, System.IntPtr w, System.IntPtr l);
          [DllImport("user32.dll", CharSet=CharSet.Unicode)] public static extern System.IntPtr FindWindow(string c, string n);
          '@
          # ── 2026-10-28 修复：主窗口定位必须排除插件的隐藏仲裁窗口 ──
          # 插件仲裁窗口带 WS_VISIBLE 样式（分层透明工具窗，用户不可见但
          # IsWindowVisible=True），且在主窗口之前创建。原 Wait-Main 用 .NET
          # MainWindowHandle 取「第一个可见顶层窗」，轮询完全可能抢在主窗口
          # 创建前解析到仲裁窗口——run 40597450315 / 40604956721 场景2 的
          # PostMessage(WM_CLOSE) 因此打到了仲裁窗口上，DefWindowProc 直接
          # DestroyWindow 销毁仲裁通道 → 二次启动方 FindWindowW 落空 → 插件
          # 不退出它 → 整应用完整启动（双进程双窗口）。这里改为枚举顶层窗并
          # 按类名/扩展样式过滤，并把候选清单打进日志备查。
          Add-Type -TypeDefinition @"
          using System;
          using System.Collections.Generic;
          using System.Runtime.InteropServices;
          using System.Text;
          public static class WBWinEnum {
            public delegate bool EnumProc(IntPtr h, IntPtr l);
            [DllImport("user32.dll")] static extern bool EnumWindows(EnumProc cb, IntPtr l);
            [DllImport("user32.dll")] static extern uint GetWindowThreadProcessId(IntPtr h, out uint pid);
            [DllImport("user32.dll", CharSet=CharSet.Unicode)] static extern int GetClassName(IntPtr h, StringBuilder s, int max);
            [DllImport("user32.dll")] static extern int GetWindowLong(IntPtr h, int i);
            [DllImport("user32.dll")] static extern bool IsWindowVisible(IntPtr h);
            public static List<string[]> List(int pid) {
              var r = new List<string[]>();
              EnumWindows(delegate(IntPtr h, IntPtr l) {
                uint wpid; GetWindowThreadProcessId(h, out wpid);
                if (wpid == (uint)pid) {
                  var sb = new StringBuilder(256); GetClassName(h, sb, 256);
                  r.Add(new string[] { h.ToString(), sb.ToString(), GetWindowLong(h, -20).ToString(), IsWindowVisible(h).ToString() });
                }
                return true;
              }, IntPtr.Zero);
              return r;
            }
          }
          "@
          function Get-Procs { @(Get-Process -Name "wb-desktop" -ErrorAction SilentlyContinue) }
          function Kill-All {
            & taskkill /T /F /IM wb-desktop.exe 2>$null | Out-Null
            $global:LASTEXITCODE = 0
            Start-Sleep -Seconds 3
          }
          function Wait-Settled {
            # 固定 sleep 会把「启动慢」误判成「单实例锁失效」——run 40576683509 场景2 就是这样红的：
            # 同一份 lib.rs（375ee689…）在 run 40508417582 却是 success。三处定额本身还不一致
            # （场景1/2 给 8s、场景3 给 18s）。这里改成「等到条件成立或超时」：
            # **判据一个字没改**（仍是「恰好 1 个存活 + 启动方已退出」），超时照样 throw，
            # 只是把「等到什么时候看」从定额换成有上限的轮询，并把实测等待秒数打进日志。
            param([object[]]$procs, [int]$TimeoutSec = 25)
            $sw = [Diagnostics.Stopwatch]::StartNew()
            while ($sw.Elapsed.TotalSeconds -lt $TimeoutSec) {
              $n = (Get-Procs).Count
              $ex = 0
              foreach ($q in $procs) {
                try { if ($q.HasExited) { $ex++ } } catch { $ex++ }
              }
              if ($n -eq 1 -and $ex -ge 1) {
                return [pscustomobject]@{ Ok = $true; Alive = $n; Exited = $ex; Wait = [math]::Round($sw.Elapsed.TotalSeconds, 1) }
              }
              Start-Sleep -Milliseconds 500
            }
            $n = (Get-Procs).Count
            $ex = 0
            foreach ($q in $procs) {
              try { if ($q.HasExited) { $ex++ } } catch { $ex++ }
            }
            return [pscustomobject]@{ Ok = $false; Alive = $n; Exited = $ex; Wait = [math]::Round($sw.Elapsed.TotalSeconds, 1) }
          }

          function Wait-RealMain([int]$procId) {
            # 真主窗口：可见 + 非插件仲裁窗（*-sic/*-siw）+ 非分层/工具窗
            # （WS_EX_LAYERED|WS_EX_TOOLWINDOW = 0x80000|0x80 = 0x80080）
            for ($i = 0; $i -lt 60; $i++) {
              foreach ($w in [WBWinEnum]::List($procId)) {
                if ($w[1] -like "*-sic" -or $w[1] -like "*-siw") { continue }
                $ex = [int64]$w[2]
                if (($ex -band 0x80080) -ne 0) { continue }
                if ($w[3] -ne "True") { continue }
                Write-Host "主窗口定位：hwnd=$($w[0]) class=$($w[1]) ex=0x$($ex.ToString('X'))（轮询第 $i 次）"
                return [IntPtr][Convert]::ToInt64($w[0])
              }
              Start-Sleep -Milliseconds 500
            }
            Write-Host "::warning::60 次轮询（30s）未定位到真主窗口，pid=$procId 顶层窗清单："
            [WBWinEnum]::List($procId) | ForEach-Object { Write-Host "   hwnd=$($_[0]) class=$($_[1]) ex=$($_[2]) visible=$($_[3])" }
            return [IntPtr]::Zero
          }

          Kill-All
          $p1 = Start-Process -FilePath $exe -PassThru
          $h1 = Wait-RealMain $p1.Id
          Write-Host "首次启动：pid=$($p1.Id) hwnd=$h1"

          # ── 场景 1：任务栏最小化态 ──
          $minimizedObserved = $false
          if ($h1 -ne 0) {
            [void][WB.U]::ShowWindow($h1, 6)   # SW_MINIMIZE
            Start-Sleep -Seconds 2
            $minimizedObserved = [WB.U]::IsIconic($h1)
            Write-Host "场景1：窗口最小化已生效=$minimizedObserved"
          } else {
            Write-Host "::warning::场景1：30s 内未定位到真主窗口（CI 会话可能无交互桌面），无法施加最小化态；硬断言（单进程）照常执行"
          }
          $s1 = Start-Process -FilePath $exe -PassThru
          $w1 = Wait-Settled -procs @($s1) -TimeoutSec 25
          $n1 = $w1.Alive
          Write-Host "场景1 等待：$($w1.Wait)s（上限 25s）后 存活进程=$n1，启动方已退出=$($w1.Exited)"
          if ($n1 -ne 1) { throw "场景1 失守：二次启动后存活 $n1 个进程（应为 1，单实例锁未生效）" }
          if ($w1.Exited -lt 1) { throw "场景1 失守：二次启动进程等待 $($w1.Wait)s 仍未退出（pid=$($s1.Id)）" }
          $restored = "未取到可见证据"
          if ($h1 -ne 0) {
            # 用启动时定位的真主窗口句柄复查，不用 .NET MainWindowHandle——
            # 托盘/仲裁窗在场时它会解析到错误窗口（见本步顶部根因注释）。
            $restored = if ([WB.U]::IsIconic($h1)) { "仍最小化（未恢复）" } else { "已恢复（IsIconic=false）" }
            if ($restored -like "仍最小化*") { Write-Host "::warning::场景1：二次启动后真主窗口仍未恢复（恢复逻辑未生效，硬断言未含此项，如实上报）" }
          }
          Write-Host "场景1 结果：存活进程=$n1，落败进程已退出(exit=$($s1.ExitCode))，窗口恢复=$restored"

          # ── 场景 2：托盘态（B7：点 × 只 hide 不退出）──
          if ($h1 -ne 0) {
            [void][WB.U]::PostMessage($h1, 0x0010, [IntPtr]::Zero, [IntPtr]::Zero)  # WM_CLOSE → 真主窗口
            Start-Sleep -Seconds 3
            $alive = (Get-Procs).Count
            if ($alive -ne 1) { throw "场景2 前置不成立：点 × 后进程应常驻托盘，实际存活 $alive 个" }
            # 硬前置：插件仲裁窗口必须仍在——通道完整性是二次启动方能被仲裁的前提。
            # 此前两次失败（run 40597450315 / 40604956721）的根因就是 WM_CLOSE 误中
            # 仲裁窗口致通道销毁；把该状态前移到「施加态」就 throw，失败日志直接
            # 指向根因，而不是 25s 后才在「判据」处红。
            $arb = [WB.U]::FindWindow("$id-sic", "$id-siw")
            if ($arb -eq [IntPtr]::Zero) { throw "场景2 前置不成立：点 × 后插件仲裁窗口（$id-sic）已消失——通道被销毁，二次启动将无法被仲裁" }
            Write-Host "场景2 前置：点 × 后进程常驻 $alive 个（hide 不退出），仲裁窗口健在=True，真主窗口可见=$([WB.U]::IsWindowVisible($h1))（应为 False）"
          } else {
            Write-Host "::warning::场景2：无真主窗口句柄可发 WM_CLOSE，跳过托盘态施加；硬断言照常执行"
          }
          $s2 = Start-Process -FilePath $exe -PassThru
          $w2 = Wait-Settled -procs @($s2) -TimeoutSec 25
          $n2 = $w2.Alive
          Write-Host "场景2 等待：$($w2.Wait)s（上限 25s）后 存活进程=$n2，启动方已退出=$($w2.Exited)"
          if ($n2 -ne 1) { throw "场景2 失守：二次启动后存活 $n2 个进程（应为 1）" }
          if ($w2.Exited -lt 1) { throw "场景2 失守：二次启动进程等待 $($w2.Wait)s 仍未退出（pid=$($s2.Id)）" }
          $vis = "未取到可见证据"
          if ($h1 -ne 0) {
            # 同上：用真主窗口句柄判定，hide→二次启动→回调 show 后应可见。
            $vis = if ([WB.U]::IsWindowVisible($h1)) { "可见（已 show+置前）" } else { "不可见（未恢复）" }
            if ($vis -eq "不可见（未恢复）") { Write-Host "::warning::场景2：二次启动后真主窗口仍不可见（托盘恢复逻辑未生效，硬断言未含此项，如实上报）" }
          }
          Write-Host "场景2 结果：存活进程=$n2，落败进程已退出，窗口=$vis"

          # ── 场景 3：快速双击竞态 ──
          Kill-All
          $a = Start-Process -FilePath $exe -PassThru
          $b = Start-Process -FilePath $exe -PassThru
          $w3 = Wait-Settled -procs @($a, $b) -TimeoutSec 40
          $n3 = $w3.Alive
          $exited = $w3.Exited
          Write-Host "场景3 等待：$($w3.Wait)s（上限 40s）后 存活进程=$n3，已退出的启动方=$exited"
          if ($n3 -ne 1) { throw "场景3 失守：并发双击后存活 $n3 个进程（快速双击竞态未被锁住）" }
          if ($exited -lt 1) { throw "场景3 失守：并发双击后两个启动进程都还活着（无单实例仲裁）" }
          Write-Host "场景3 结果：并发双击 → 存活 $n3 个，已退出的启动方 $exited 个"

          Kill-All
          $global:LASTEXITCODE = 0
          Write-Host "单实例三场景：硬断言全部通过（每次二次启动后存活进程数均为 1）"

      # 清单现在**必须在发布步**生成：它要用 Release 上真实的资产名（见发布步说明），
      # 而那要等二进制上传完才拿得到。这里只做「可否生成」的说明性尝试——
      # tag 推送时留给发布步，手动触发（无 Release）本就没有真实资产名，跳过不算失败。
      - name: 生成 latest.json（仅当真实资产名已可用时；否则留给发布步）
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WB_RELEASE_ASSET)) {
            Write-Host "WB_RELEASE_ASSET 未提供（非发布流程），跳过预生成；清单将由发布步按真实资产名生成。"
            exit 0
          }
          node scripts/make-manifest.cjs
          if (-not (Test-Path "latest.json")) { throw "latest.json 未生成" }
          Write-Host "已预生成 latest.json（发布步会按 Release 真实资产名再生成一次）"
      # 注意：latest.json **不在这里**——它必须在发布步按 Release 真实资产名生成
      # （见发布步说明）。此前把清单列进 artifact 会让「产物里有清单」成为假象：
      # 那份清单是按本地中文名拼的，地址实测 404。宁可不承诺，也不放一份错清单。
      - uses: actions/upload-artifact@v4
        with:
          name: workbench-windows
          if-no-files-found: error
          path: |
            target/release/bundle/nsis/workbench_*-setup.exe
            target/release/bundle/nsis/workbench_*-setup.exe.sig
            target/release/bundle/msi/workbench_*-*.msi

      # ── v2.1：发布 GitHub Release（latest.json 的零鉴权下载宿主）──
      # tauri.conf.json 里 updater endpoint 是
      # releases/latest/download/latest.json，依赖「最新 Release 挂了 latest.json 资产」。
      # tag 推送时把安装包、.sig 签名、latest.json 一起挂上；手动触发（无 tag）
      # 跳过发布、只留 artifact。用 gh CLI（runner 预装）+ 内置 GITHUB_TOKEN，
      # 不引第三方 action。仓库为公共时 Release 资产零鉴权可下载；若为私有，
      # latest.json 地址不可公开访问——这是发布环节的已知阻塞形态，按任务红线
      # 如实上报，不得当作更新链路已达标。
      - name: 发布 GitHub Release（tag 触发时）
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # ── 2026-10-27 结构性修复：先传二进制、回读真实资产名、再据实生成清单 ──
          # v2.1.0 实测缺陷：make-manifest 按**本地中文文件名**拼 URL，而 Release
          # 实际保存的资产名被剥掉了中文前缀（个人工作台_… → _…），清单里的地址
          # 变成 404 ——自动更新在下载步必然失败，而 CI 全绿、无人发现。
          # 单靠「改名成 ASCII」只是堵住这一次；本步把顺序改成：
          #   ① 只上传二进制与 .sig（清单最后传）
          #   ② 用 gh release view 回读 Release 上**真实存在的**资产名
          #   ③ 把真实名字喂给 make-manifest，据实拼 URL
          #   ④ 校验清单 URL 的资产名确实在资产表里，再上传 latest.json
          # 这样「清单说什么」与「Release 存了什么」由同一份事实派生，
          # 结构上不再可能对不上，也不再依赖「平台会不会剥离字符」这个假设。
          $tag = "$env:GITHUB_REF_NAME"
          $bins = @()
          foreach ($g in @("target/release/bundle/nsis/workbench_*-setup.exe",
                           "target/release/bundle/nsis/workbench_*-setup.exe.sig",
                           "target/release/bundle/msi/workbench_*-*.msi")) {
            $bins += @(Get-ChildItem $g -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName })
          }
          if ($bins.Count -eq 0) { throw "没有可发布的二进制产物（ASCII 规范化步骤未生效？）" }

          Write-Host "① 发布二进制资产："
          $bins | ForEach-Object { Write-Host "   $_" }
          # 重跑同一 tag 时 gh release create 会因 Release 已存在而失败（exit 1）。
          # 先删旧 Release（保留 tag），保证「清单与资产」每次都从同一次构建重新派生；
          # 旧 Release 的资产是上一次构建的产物，留着只会让资产表出现同名多份。
          $existing = gh release view $tag --json assets 2>$null
          if ($LASTEXITCODE -eq 0 -and $existing) {
            Write-Host "   已存在 Release $tag，先删除以重建（tag 保留）"
            gh release delete $tag --yes --cleanup-tag=false
            if ($LASTEXITCODE -ne 0) { throw "gh release delete 失败（exit $LASTEXITCODE）" }
          }
          $global:LASTEXITCODE = 0
          gh release create $tag --title $tag `
            --notes "综合工作台 v2.2.1：产品名全面对齐综合工作台（窗口/快捷方式/安装包/界面/描述）、存量迁移钩子（旧名卸载项与旧目录清理+MSI 清理+更新模式补建快捷方式）、更新验证脚本去硬编码、升级真机实测纳入 CI：桌面自动更新上线、单机化（移除多端同步 UI）、晨报语音播报、UTC+8 晨报送达修正、免打扰可编辑。" `
            @bins
          if ($LASTEXITCODE -ne 0) { throw "gh release create 失败（exit $LASTEXITCODE）" }

          Write-Host "② 回读 Release 上的真实资产名"
          $view = gh release view $tag --json assets | ConvertFrom-Json
          $names = @($view.assets | ForEach-Object { $_.name })
          $names | ForEach-Object { Write-Host "   实际资产：$_" }
          $exe = @($names | Where-Object { $_ -like "*-setup.exe" })
          $sig = @($names | Where-Object { $_ -like "*-setup.exe.sig" })
          if ($exe.Count -ne 1) { throw "Release 上应有且仅有 1 个 setup.exe，实际 $($exe.Count)：$($names -join ', ')" }
          if ($sig.Count -ne 1) { throw "Release 上应有且仅有 1 个 .sig，实际 $($sig.Count)" }

          # 签名内容仍取本地 .sig 产物（与上传的二进制一一对应）
          $sigFile = Get-ChildItem "target/release/bundle/nsis/workbench_*-setup.exe.sig" -File | Select-Object -First 1
          $sigBody = (Get-Content $sigFile.FullName | Where-Object { $_.Trim() } | Select-Object -First 1).Trim()
          # ⚠️ 必须直接赋 $env:（进程环境），不能只写 GITHUB_ENV：
          # GITHUB_ENV 的写入只对**后续步骤**生效，本步骤内启动的 node 读不到。
          # run 40508417582 即败于此：make-manifest 报「缺少 WB_RELEASE_ASSET」，
          # 而变量其实已经算出来了，只是写错了地方。
          $env:WB_SIGNATURE     = $sigBody
          $env:WB_RELEASE_ASSET = $exe[0]

          Write-Host "③ 按真实资产名重新生成清单"
          node scripts/make-manifest.cjs
          if (-not (Test-Path "latest.json")) { throw "latest.json 未生成（WB_UPDATE_BASE / WB_SIGNATURE / WB_RELEASE_ASSET 是否齐全？）" }
          $m = Get-Content "latest.json" -Raw | ConvertFrom-Json
          $w = $m.platforms.'windows-x86_64'
          $uName = [System.Uri]::UnescapeDataString(($w.url -split '/')[-1])
          if ($names -notcontains $uName) {
            throw "清单 URL 指向 [$uName]，但 Release 上只有 [$($names -join ', ')] ——上传清单会让自动更新再次 404"
          }
          $need = @("windows-x86_64","darwin-x86_64","darwin-aarch64","linux-x86_64")
          $lost = @($need | Where-Object { $names -notcontains $_ -and -not ($m.platforms.PSObject.Properties.Name -contains $_) })
          if ($lost.Count -gt 0) { throw "清单平台键缺失：$($lost -join ', ')" }
          Write-Host "   清单 URL 与真实资产一致：$uName"

          Write-Host "④ 上传清单"
          gh release upload $tag "latest.json" --clobber
          if ($LASTEXITCODE -ne 0) { throw "gh release upload latest.json 失败（exit $LASTEXITCODE）" }
          Write-Host "Release 已发布：$tag（资产：$($names -join ', ') + latest.json）"

      # ── 2026-10-27 修复：发布后核验清单下载地址真实可达 ──
      # 上面那条 404 之所以能一路绿灯到「Release 已发布」，是因为全流程没有一个
      # 环节真正去取一次清单里的 URL。本步补上：清单声明的资产名必须在 Release
      # 资产表里真实存在、大小与本地构建产物一致；否则直接失败。
      # 匿名可达性是**私有仓库口径**下的已知阻塞，只告警不失败（不伪装成达标），
      # 由交付报告如实上报，等用户在三方案里拍板后再补端到端验证。
      - name: 发布后核验下载地址（清单资产名必须真实存在且大小一致）
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $m = Get-Content "latest.json" -Raw | ConvertFrom-Json
          $url = $m.platforms.'windows-x86_64'.url
          if ([string]::IsNullOrWhiteSpace($url)) { throw "清单 windows-x86_64.url 为空" }
          $name = [System.Uri]::UnescapeDataString(($url -split '/')[-1])
          $local = Get-ChildItem "target/release/bundle/nsis/workbench_*-setup.exe" -File | Select-Object -First 1
          if (-not $local) { throw "本地未找到 ASCII 命名的 NSIS 产物，规范化步骤未生效" }

          $view = gh release view "$env:GITHUB_REF_NAME" --json assets | ConvertFrom-Json
          $hit = @($view.assets | Where-Object { $_.name -eq $name })
          if ($hit.Count -eq 0) {
            $have = (@($view.assets | ForEach-Object { $_.name }) -join ', ')
            throw "清单声明的资产名 [$name] 不在 Release 资产表里（实际：$have）——自动更新下载必然 404"
          }
          if ([int64]$hit[0].size -ne [int64]$local.Length) {
            throw "资产大小与构建产物不一致：Release=$($hit[0].size) / 本地=$($local.Length)"
          }
          Write-Host "清单 URL 与 Release 资产一致：$name（$($hit[0].size) 字节）"

          $anon = 0
          try {
            $r = Invoke-WebRequest -Uri $url -Method Head -MaximumRedirection 5 -SkipHttpErrorCheck -TimeoutSec 30
            $anon = [int]$r.StatusCode
          } catch { $anon = 0 }
          if ($anon -eq 200) {
            Write-Host "匿名访问清单下载地址：200（零鉴权可下载，更新链路端到端可达）"
          } else {
            Write-Host "::warning::匿名访问清单下载地址返回 $anon（非 200）：仓库为私有时 Release 资产不可零鉴权下载，自动更新在此形态下不可达。按私有仓库口径如实上报，不由本步伪装成达标。"
          }
