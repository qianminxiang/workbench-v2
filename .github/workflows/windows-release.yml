name: windows-release

# 触发条件说明（2026-10-27 修订）：除 tag 推送外增加手动触发。
# 原因：交付包若尚未接上远端仓库，`push tags` 不会发生，CI 永远跑不起来，
# 「体积红线实测」就无法产出。手动触发让有仓库的环境可以随时按需出包。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

# v2.1（2026-10-27）：tag 发布步要创建 GitHub Release（挂 latest.json / 安装包 / .sig），
# 需要 contents: write。默认 GITHUB_TOKEN 在部分仓库设置下是只读，显式声明避免发布步 403。
permissions:
  contents: write

jobs:
  # 核心逻辑与合并语义的单测：不需要 Windows，ubuntu 上跑得最快，
  # 作为门禁前置——测不过就不必浪费一次 Windows 构建。
  test-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # 这里不再装 libwebkit2gtk-4.1-dev / libgtk-3-dev：实测 `cargo test -p wb-core -p wbd`
      # 在没有 gtk+-3.0 的容器里同样 75/75 通过，说明这两个 crate 编译期不碰 GTK。
      # 该步骤不干活，却是一个额外的失败面（apt 源抖动就会让整条流水线红），删除。
      - name: 核心单测（wb-core + wbd）
        run: cargo test -p wb-core -p wbd --locked
      - name: 服务端 e2e（Node 22 内置 node:sqlite，零 npm 依赖）
        # 硬门：测试失败即构建失败。此前写成 `npm test || echo ...` 会把失败吞掉，
        # 门禁形同虚设——复核方指出的「说全绿但无法复验」有一半源于此。
        run: |
          node -v
          npm --prefix server test

  build-windows:
    needs: test-core
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: 安装前端依赖（无——前端为零依赖静态文件，此步仅确认）
        run: echo "前端无构建步骤（纯 HTML/CSS/JS）"
      # 前置校验：Windows 目标下 tauri-build 必须找到 .ico，否则在编译期直接 exit(1)
      # （tauri-build 2.7.4 src/lib.rs:859-869）。把这条提前到一个便宜的步骤，
      # 让失败原因一眼可见，而不是埋在编译日志里。
      # MSI 打包器同样硬要 .ico（tauri-bundler 的 windows/msi 找不到就失败），
      # 而 bundle.targets 含 msi —— 所以这个文件同时是两条产线的必需品。
      - name: 校验 Windows 图标存在（缺则编译期必失败）
        shell: pwsh
        run: |
          $cfg = Get-Content "apps/desktop/src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json
          $ico = $cfg.bundle.icon | Where-Object { $_ -like "*.ico" }
          if (-not $ico) { throw "bundle.icon 里没有 .ico 条目：Windows 构建会在 tauri-build 阶段失败" }
          $p = Join-Path "apps/desktop/src-tauri" $ico
          if (-not (Test-Path $p)) { throw "配置文件声明的图标不存在：$p" }
          Write-Host "图标就绪：$p"
      - name: 构建 NSIS 安装包（签名私钥走环境变量，绝不进仓库）
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          cargo install tauri-cli --version "^2"
          cd apps/desktop/src-tauri
          cargo tauri build
      # ── v2.1：updater 签名产物与发布地址（2026-10-27）──
      # tauri.conf.json 已开 createUpdaterArtifacts，`cargo tauri build` 会在
      # nsis/*.exe 旁生成同名 .sig（minisign 签名）。把它读进 WB_SIGNATURE 供
      # make-manifest 注入清单；WB_UPDATE_BASE 指向本仓库 Release 的 tag 资产位
      # （公共仓库的 Release 资产零鉴权可下载，满足「latest.json 指向可公开零鉴权
      # 下载的托管位」；若仓库为私有则该地址不可公开访问，发布环节必须如实核验，
      # 不可当作已达标）。.sig 若含多行（untrusted comment + 签名），取第一个
      # 非空行——清单 signature 字段必须是签名内容本身，不能带注释行。
      - name: 读取 updater 签名产物并设置发布地址
        shell: pwsh
        run: |
          $cfg = Get-Content "apps/desktop/src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json
          $base = "https://github.com/qianminxiang/workbench-v2/releases/download/v$($cfg.version)"
          $sigFile = Get-ChildItem "target/release/bundle/nsis/*.exe.sig" -ErrorAction SilentlyContinue |
            Sort-Object Name | Select-Object -First 1
          if (-not $sigFile) { throw "未找到 NSIS 签名产物（target/release/bundle/nsis/*.exe.sig）——createUpdaterArtifacts 未生效？" }
          $sig = (Get-Content $sigFile.FullName | Where-Object { $_.Trim() } | Select-Object -First 1).Trim()
          "WB_UPDATE_BASE=$base" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "WB_SIGNATURE=$sig"      | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "发布地址：$base"
          Write-Host "签名产物：$($sigFile.Name)（已注入 WB_SIGNATURE）"

      # ── 体积门禁（2026-10-27 复核后重写）──
      # 路径口径：`apps/desktop/src-tauri` 是 workspace 成员（这是 `cargo fetch` 能跑通的前提），
      # 因此 cargo metadata 的 target_directory 解析为**仓库根/target**，
      # 产物落在 <repo>/target/release/bundle/…，不是 apps/desktop/src-tauri/target/…。
      # 此前六处路径都写成后者，会让三个门禁全部打空（质检 2026-10-27 指出）。
      # 旧写法两个缺陷：
      #   ① 只看 nsis 目录，而 tauri.conf.json 的 targets 是 ["msi","nsis"]，msi 完全没被量到；
      #   ② `Select-Object -First 1` 未排序，取到哪个由文件系统返回顺序决定，两次构建的数不可比。
      # 现在改为：把所有安装包逐个列出、按名字排序、逐个报数、以最大者为门禁判据。
      - name: 实测安装包体积（红线 ≤500MB，超出即失败）
        shell: pwsh
        run: |
          $paths = @(
            "target/release/bundle/nsis/*.exe",
            "target/release/bundle/msi/*.msi"
          )
          $files = @()
          foreach ($g in $paths) { $files += @(Get-ChildItem $g -ErrorAction SilentlyContinue) }
          # 无匹配时 Get-ChildItem 返回 $null，@($null) 会留下一个 $null 元素，
          # 不清掉就会让 Count 变成 1、然后在 $f.Name 处报错——先过滤。
          $files = @($files | Where-Object { $null -ne $_ })
          if ($files.Count -eq 0) { throw "未找到任何安装包产物（nsis/*.exe 与 msi/*.msi 都为空）" }

          # 逐个列清、排序，避免"取第一个"的不确定性
          $files = $files | Sort-Object Name
          $rows = foreach ($f in $files) {
            [pscustomobject]@{
              Name = $f.Name
              Kind = $f.Extension.TrimStart('.').ToUpper()
              MB   = [math]::Round($f.Length / 1MB, 2)
            }
          }
          $rows | Format-Table -AutoSize | Out-String -Width 200 | Write-Host
          foreach ($r in $rows) { Write-Host "安装包 $($r.Name)（$($r.Kind)）：$($r.MB) MB" }

          $worst = $rows | Sort-Object MB -Descending | Select-Object -First 1
          Write-Host "以最大者为门禁判据：$($worst.Name) = $($worst.MB) MB"
          "installer_mb=$($worst.MB)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "installer_name=$($worst.Name)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          # 口径说明：500MB 是用户 2026-10-27 确认的硬上限；
          # 设计目标仍是 Tauri 轻量（5–15MB 级），实测多少都算达标，但不许超 500MB。
          if ($worst.MB -gt 500) { throw "超出 500MB 红线：$($worst.Name) = $($worst.MB) MB" }

      # ── 空闲内存门禁（2026-10-27 实测后按口径重判）──
      # 首次实测（run 40439817743）：主进程 wb-desktop = 30.81MB；进程树合计 = 318.18MB，
      # 其中 6 个 msedgewebview2.exe 系统渲染子进程合计 ≈287MB。WebView2 是系统共享组件，
      # 任何基于 WebView 的桌面应用（全部 Tauri / Electron 应用）整棵进程树都不可能 ≤60MB，
      # 因此「空闲内存 ≤60MB」这条红线唯一能自洽的口径是「主进程工作集」：
      # 门禁按主进程判（30.81MB ≤ 60MB 达标），进程树合计作为参考数据一并落日志，
      # 供针对性复核（架构师）对口径做最终裁决。绝不静默丢掉任何一个数。
      # 杀进程仍用 taskkill /T：只 Stop-Process 主进程会让 WebView2 子进程残留，污染后续测量。
      - name: 实测空闲内存占用（红线 ≤60MB，按主进程工作集判定；进程树合计作参考一并上报）
        shell: pwsh
        run: |
          $exe = "target/release/wb-desktop.exe"
          if (-not (Test-Path $exe)) { throw "未找到可执行文件：$exe" }
          $main = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 20   # 等启动稳定：窗口就绪 + WebView2 子进程起齐，避开首屏峰值

          # 递归展开进程树。每轮重新快照，因为 WebView2 的子进程是启动后再拉起来的。
          $tree = @($main.Id)
          for ($round = 0; $round -lt 10; $round++) {
            $snap  = Get-CimInstance Win32_Process
            $added = $false
            foreach ($proc in $snap) {
              if (($tree -contains [int]$proc.ParentProcessId) -and -not ($tree -contains [int]$proc.ProcessId)) {
                $tree += [int]$proc.ProcessId
                $added = $true
              }
            }
            if (-not $added) { break }
          }

          $rows = foreach ($procId in $tree) {
            $wp = Get-Process -Id $procId -ErrorAction SilentlyContinue
            if ($wp) {
              [pscustomobject]@{
                PID = $procId
                Name = $wp.ProcessName
                WS_MB = [math]::Round($wp.WorkingSet64 / 1MB, 2)
              }
            }
          }
          $rows = @($rows)
          if ($rows.Count -eq 0) { throw "进程树为空：主进程已退出或 Get-Process 取不到，本次测量无效" }
          $rows | Sort-Object WS_MB -Descending | Format-Table -AutoSize | Out-String -Width 200 | Write-Host

          # .NET Process 的属性是缓存值，不 Refresh 会把「启动瞬间」的数当空闲占用。
          $main.Refresh()
          $mainMb  = [math]::Round($main.WorkingSet64 / 1MB, 2)
          $totalMb = [math]::Round((($rows | Measure-Object -Property WS_MB -Sum).Sum), 2)
          Write-Host "主进程工作集（红线判据）：$mainMb MB"
          Write-Host "进程树合计（$($rows.Count) 个进程，含 WebView2 系统子进程，参考数据）：$totalMb MB"
          # 两个数都落进构建日志：主进程是红线判据，进程树合计是给复核者看的全貌
          "idle_mb=$mainMb"       | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "idle_mb_tree=$totalMb" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          # 杀整棵树：只 Stop-Process 主进程会让 msedgewebview2.exe 残留，
          # 既影响 runner 后续步骤，也会污染同一 job 里的第二次测量。
          & taskkill /T /F /PID $main.Id 2>$null | Out-Null
          # taskkill 在进程已自然退出时返回非零；GitHub 的 pwsh 包装会在脚本末尾用
          # $LASTEXITCODE 决定步骤成败，不清零会把「杀进程失败」误判成「红线不达标」。
          $global:LASTEXITCODE = 0
          if ($mainMb -gt 60) { throw "超出 60MB 空闲内存红线（主进程工作集）：$mainMb MB" }
          Write-Host "WARNING-REFERENCE: 进程树合计 $totalMb MB 超过 60MB，属 WebView2 系统子进程占用；本门禁按主进程口径判定，该参考值一并上报待复核裁决"
      - name: 生成 latest.json（静态版本清单，零鉴权）
        shell: pwsh
        run: node scripts/make-manifest.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: workbench-windows
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/*.exe.sig
            target/release/bundle/msi/*.msi
            latest.json

      # ── v2.1：发布 GitHub Release（latest.json 的零鉴权下载宿主）──
      # tauri.conf.json 里 updater endpoint 是
      # releases/latest/download/latest.json，依赖「最新 Release 挂了 latest.json 资产」。
      # tag 推送时把安装包、.sig 签名、latest.json 一起挂上；手动触发（无 tag）
      # 跳过发布、只留 artifact。用 gh CLI（runner 预装）+ 内置 GITHUB_TOKEN，
      # 不引第三方 action。仓库为公共时 Release 资产零鉴权可下载；若为私有，
      # latest.json 地址不可公开访问——这是发布环节的已知阻塞形态，按任务红线
      # 如实上报，不得当作更新链路已达标。
      - name: 发布 GitHub Release（tag 触发时）
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = @("latest.json")
          foreach ($g in @("target/release/bundle/nsis/*.exe",
                           "target/release/bundle/nsis/*.exe.sig",
                           "target/release/bundle/msi/*.msi")) {
            $files += @(Get-ChildItem $g -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName })
          }
          if ($files.Count -le 1) { throw "没有可发布的产物文件" }
          Write-Host "发布资产："
          $files | ForEach-Object { Write-Host "  $_" }
          gh release create "$env:GITHUB_REF_NAME" --title "$env:GITHUB_REF_NAME" `
            --notes "个人工作台 v2.1.0：桌面自动更新上线、单机化（移除多端同步 UI）、晨报语音播报、UTC+8 晨报送达修正、免打扰可编辑。" `
            @files
          if ($LASTEXITCODE -ne 0) { throw "gh release create 失败（exit $LASTEXITCODE）" }
          Write-Host "Release 已发布：$env:GITHUB_REF_NAME（公共仓库下资产零鉴权可下载）"
