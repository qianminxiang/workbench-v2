[package]
name = "wb-desktop"
version = "2.2.1"
edition = "2021"
description = "综合工作台 v2.1 桌面壳（Tauri 2，单机版）"

[lib]
name = "wb_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

# E2E-only feature：自动更新端到端验证的驱动（src/e2e.rs）。
# 默认关闭，发布流水线 `cargo tauri build` 不打开它，因此 Release 资产里
# 不含任何测试入口；只有 .github/workflows/update-e2e.yml 会显式 `--features e2e-update`。
# 关掉后本模块整体不参与编译，二进制与 v2.1.0 发布物同一份代码路径。
[features]
default = []
e2e-update = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
wb-core = { path = "../../../crates/wb-core" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
# v2.1 目标①：桌面自动更新（检查 → 下载 → 验签 → 重启安装）
tauri-plugin-updater = "2"
# v2.1 防多开：单实例锁，二次启动置前已有主窗口（任务栏最小化态/托盘态/快速双击竞态）
tauri-plugin-single-instance = "2"
# v2.2.1 设置页导入：接原生文件选择器（用户手填路径点导入「无法拉起」）
tauri-plugin-dialog = "2"
# v2.1 B7①：today()/now_minutes() 取本机时区偏移（换算本身在 wb-core::local_time）
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
base64 = "0.22"
# v2.1 单机化：移除 ureq 同步传输层（wb-core sync 纯函数保留，server/ 保留可跑）
